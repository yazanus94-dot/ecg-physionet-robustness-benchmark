# ECG-ROBUST — optional configuration overrides.
# Set ECG_ROBUST_CONFIG=configs/default.yaml to apply these values; otherwise
# the historical constants in src/ecg_robust/config.py are used. Only keys
# listed here are applied and all values are validated before use.

fs: 360                      # MITDB sampling frequency (Hz)
n_splits: 5                  # patient-independent folds
random_state: 42

# Note: recordings 201 and 202 belong to the same subject. This grouping is
# encoded in src/ecg_robust/splits.py (make_groups) and is not configurable.

# Segmentation window: [r_i - 0.25*fs, r_i + 0.45*fs]
segmentation:
  before_s: 0.25
  after_s: 0.45
  min_length: 3

# Preprocessing: 4th-order Butterworth, 0.5–40 Hz, forward-backward.
preprocessing:
  low_hz: 0.5
  high_hz: 40.0
  order: 4

noise:
  snr_db: [24.0, 18.0, 12.0, 6.0, 0.0, -6.0]   # target SNR levels
  n_noise_realizations: 8                        # NSTDB noise realizations

classes: [N, S, V, F, Q]
