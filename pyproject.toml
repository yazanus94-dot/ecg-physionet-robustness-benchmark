# Package metadata (PEP 621) for src-layout python project ecg-robust.
[project]
name = "ecg-robust"
version = "1.0.0"
description = "ECG-ROBUST: Patient-Independent ECG Arrhythmia Classification and Noise-Robustness Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "wfdb>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.0",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "wfdb",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn"
follow_imports = "skip"
