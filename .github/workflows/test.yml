# Continuous-integration tests for ECG-ROBUST.
# Runs unit tests (dataset tests auto-skip unless data/raw/mitdb is present).
name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e .
      - run: python -m pytest -q --deselect tests/test_dataset.py
      - name: Run expert benchmark task tests (tasks/ecg_arrhythmia_robustness)
        run: python -m pytest -q tasks/ecg_arrhythmia_robustness/tests
      - name: Run the reference grader
        run: python tasks/ecg_arrhythmia_robustness/grader.py
      - name: Run denoising benchmark tests and grader
        run: |
          python -m pytest -q tasks/ecg_denoising_quality/tests
          python tasks/ecg_denoising_quality/grader.py tasks/ecg_denoising_quality/reference_solution.py
      - name: Run classification benchmark tests and grader
        run: |
          python -m pytest -q tasks/arrhythmia_classification/tests
          python tasks/arrhythmia_classification/grader.py tasks/arrhythmia_classification/reference_solution.py
      - name: Install dev tools
        run: python -m pip install -r dev-requirements.txt
      - name: Lint (ruff check)
        run: python -m ruff check src tests tasks
      - name: Format check (ruff format --check)
        run: python -m ruff format --check src tests tasks
      - name: Typecheck (mypy src)
        run: python -m mypy src
